name: Manual Firefox release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed version tag, such as v1.2.3
        required: true
        type: string
      publish:
        description: Publish immediately (otherwise create a draft)
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    environment: firefox-release
    permissions:
      contents: write
    steps:
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.1'
      - name: Check version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node -e "if ('v' + require('./package.json').version !== process.env.RELEASE_TAG) process.exit(1)"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - run: node scripts/validateFirefox.cjs
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          args=(--verify-tag --title "Moo $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md)
          if [[ "$PUBLISH" != true ]]; then args+=(--draft); fi
          gh release create "$RELEASE_TAG" build/firefox-*.zip "${args[@]}"
